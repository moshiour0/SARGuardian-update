<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 452" width="920" height="452"
     font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" role="img"
     aria-label="Velocity ladder showing where NISAR L2 phase and offset tracking work, and the blind band between them">
  <title>What NISAR L2 can measure, by velocity</title>
  <desc>Interferometric phase is limited above about 5 mm/day by the L-band quarter-wavelength ceiling at 12-day repeat. Offset tracking has a measured floor of 32 mm/day at a candidate scar for the 26 August 2026 collapse. Between them is a band neither product can see. The precursor that was actually recorded, 0.33 mm/day, sits far below the offset floor and is invisible to it.</desc>

  <style>
    .bg   { fill: #FFFFFF; }
    .ink  { fill: #0E1319; }
    .mut  { fill: #6B7684; }
    .rule { stroke: #D3DAE3; }
    .axis { stroke: #0E1319; }
    .blue { fill: #2166AC; }  .blueS { stroke: #2166AC; }
    .red  { fill: #B2182B; }  .redS  { stroke: #B2182B; }
    .gap  { fill: #6B7684; }
    .bandPhase  { fill: #2166AC; fill-opacity: .13; }
    .bandOffset { fill: #B2182B; fill-opacity: .13; }
    .bandBlind  { fill: #6B7684; fill-opacity: .16; }
    @media (prefers-color-scheme: dark) {
      .bg   { fill: #0C1015; }
      .ink  { fill: #E6EBF1; }
      .mut  { fill: #94A0AE; }
      .rule { stroke: #2A3441; }
      .axis { stroke: #E6EBF1; }
      .blue { fill: #7FB0DF; }  .blueS { stroke: #7FB0DF; }
      .red  { fill: #E8899A; }  .redS  { stroke: #E8899A; }
      .gap  { fill: #94A0AE; }
      .bandPhase  { fill: #7FB0DF; fill-opacity: .17; }
      .bandOffset { fill: #E8899A; fill-opacity: .17; }
      .bandBlind  { fill: #94A0AE; fill-opacity: .20; }
    }
    .t   { font-size: 13px; }
    .s   { font-size: 11.5px; }
    .lbl { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; }
    .num { font-size: 12px; font-family: 'IBM Plex Mono', ui-monospace, monospace; }
    .h   { font-size: 17px; font-weight: 600; }
  </style>

  <rect class="bg" x="0" y="0" width="920" height="452"/>

  <text class="h ink" x="40" y="38">What NISAR L2 can measure over this terrain</text>
  <text class="s mut" x="40" y="58">Downslope velocity, log scale. Bands are measured over the 82 km² source zone unless marked.</text>

  <!-- ============ bands (x = 40..880 maps log10 v from -1 to 4) ============ -->
  <!-- x(v) = 40 + (log10(v)+1)/5 * 840 -->
  <!-- 5 mm/day -> 40 + (0.699+1)/5*840 = 325.4 -->
  <!-- 32.0     -> 40 + (1.505+1)/5*840 = 460.9 -->
  <!-- 500      -> 40 + (2.699+1)/5*840 = 661.4 -->
  <rect class="bandPhase"  x="40"    y="96" width="285.4" height="86"/>
  <rect class="bandBlind"  x="325.4" y="96" width="135.5" height="86"/>
  <rect class="bandOffset" x="477.8" y="96" width="402.2" height="86"/>

  <text class="lbl blue" x="52"  y="116">Phase works</text>
  <text class="s ink"    x="52"  y="136">GUNW, winter only</text>
  <text class="s mut"    x="52"  y="152">52% of the AOI ascending;</text>
  <text class="s mut"    x="52"  y="167">1–3% in the monsoon</text>

  <text class="lbl gap" x="337" y="116">Neither</text>
  <text class="s ink"   x="337" y="136">The blind band</text>
  <text class="s mut"   x="337" y="152">Above the phase ceiling,</text>
  <text class="s mut"   x="337" y="167">below the offset floor</text>

  <text class="lbl red" x="490" y="116">Offset tracking works</text>
  <text class="s ink"   x="490" y="136">GOFF, no coherence needed</text>
  <text class="s mut"   x="490" y="152">Survives the monsoon; loses the</text>
  <text class="s mut"   x="490" y="167">surface once the slope goes</text>

  <!-- ============ axis ============ -->
  <line class="axis" x1="40" y1="212" x2="880" y2="212" stroke-width="1.4"/>
  <g class="num mut" text-anchor="middle">
    <line class="rule" x1="40"  y1="212" x2="40"  y2="219"/><text x="40"  y="236">0.1</text>
    <line class="rule" x1="208" y1="212" x2="208" y2="219"/><text x="208" y="236">1</text>
    <line class="rule" x1="376" y1="212" x2="376" y2="219"/><text x="376" y="236">10</text>
    <line class="rule" x1="544" y1="212" x2="544" y2="219"/><text x="544" y="236">100</text>
    <line class="rule" x1="712" y1="212" x2="712" y2="219"/><text x="712" y="236">1 000</text>
    <line class="rule" x1="880" y1="212" x2="880" y2="219"/><text x="880" y="236">10 000</text>
  </g>
  <text class="s mut" x="40" y="256">mm / day</text>
  <text class="s mut" x="880" y="256" text-anchor="end">= 10 m / day</text>

  <!-- ============ markers ============ -->
  <!-- Kleines Nesthorn creep 1.4-4.1 mm/day -->
  <line class="blueS" x1="264" y1="182" x2="264" y2="212" stroke-width="1.2" stroke-dasharray="3 3"/>
  <circle class="blue" cx="264" cy="212" r="3.5"/>
  <text class="s ink" x="264" y="292" text-anchor="middle">Kleines Nesthorn</text>
  <text class="s mut" x="264" y="307" text-anchor="middle">1.4–4.1 mm/day</text>
  <text class="s mut" x="264" y="322" text-anchor="middle">years before Blatten</text>

  <!-- 5 mm/day ceiling -->
  <line class="blueS" x1="325.4" y1="96" x2="325.4" y2="212" stroke-width="1.8"/>
  <text class="num blue" x="331" y="204">5.0</text>
  <text class="s blue"   x="331" y="90">λ/4 ceiling, 12-day</text>

  <!-- 32.0 the bound, measured at a candidate scar -->
  <line class="redS" x1="460.9" y1="96" x2="460.9" y2="212" stroke-width="1.8"/>
  <text class="num red" x="467" y="204">32.0</text>
  <text class="s red"   x="467" y="90">one-pixel floor at candidate 4</text>

  <!-- 19.8 AOI floor -->
  <line class="rule" x1="425.8" y1="212" x2="425.8" y2="268" stroke-width="1.2" stroke-dasharray="2 3"/>
  <text class="num mut" x="425.8" y="282" text-anchor="middle">19.8</text>
  <text class="s mut"   x="425.8" y="297" text-anchor="middle">over the AOI</text>

  <!-- Blatten 500-800 -->
  <rect class="bandOffset" x="661.4" y="196" width="34.5" height="16"/>
  <line class="redS" x1="661.4" y1="182" x2="661.4" y2="212" stroke-width="1.2" stroke-dasharray="3 3"/>
  <circle class="red" cx="678" cy="212" r="3.5"/>
  <text class="s ink" x="678" y="292" text-anchor="middle">Blatten, 6 days out</text>
  <text class="s mut" x="678" y="307" text-anchor="middle">500–800 mm/day</text>
  <text class="s mut" x="678" y="322" text-anchor="middle">16–25× the one-pixel floor</text>

  <!-- Blatten 1 day -->
  <circle class="red" cx="880" cy="212" r="3.5"/>
  <text class="s ink" x="874" y="292" text-anchor="end">1 day out</text>
  <text class="s mut" x="874" y="307" text-anchor="end">10 m/day</text>

  <!-- ============ the finding ============ -->
  <line class="rule" x1="40" y1="348" x2="880" y2="348" stroke-width="1"/>
  <text class="t ink" x="40" y="374">The 26 August 2026 failure falls in the fourth regime, off the right of this scale:</text>
  <text class="t mut" x="40" y="394">the surface is destroyed, coherence goes to zero, and offset tracking loses the ground it was tracking.</text>
  <text class="t mut" x="40" y="414">Line of sight: 9.2 mm/day on a 1 km median to 32 mm/day on one pixel, at the candidate at the published elevation.</text>
  <text class="t mut" x="40" y="434">A precursor WAS there, at 0.33 mm/day on Sentinel-1 — 28–96× below that floor, and invisible to this product.</text>
</svg>
